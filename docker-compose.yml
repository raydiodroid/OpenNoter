
services:
  backend:
    container_name: opennoter-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 国内拉不到 docker.io 时设置 BASE_REGISTRY=docker.m.daocloud.io（或其他可用镜像）
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file:
      - .env
    environment:
      - BACKEND_PORT=${BACKEND_PORT}
      - BACKEND_HOST=${BACKEND_HOST}
      # SQLite 落到 data 卷；多副本请改 Postgres，见 README「多副本」
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/open_noter.db}
    volumes:
      # 代码在镜像内（Dockerfile COPY）；这里只挂运行时数据，避免整目录 ./backend:/app
      # 把代码与 DB/密钥/Cookie/笔记混在一起（备份易泄露，升级也难）。
      # 本地改代码热重载可临时加回：- ./backend:/app（会盖住镜像代码）。
      - ./backend/data:/app/data
      - ./backend/config:/app/config
      - ./backend/static:/app/static
      - ./backend/uploads:/app/uploads
      - ./backend/note_results:/app/note_results
      - ./backend/models:/app/models
      - ./backend/logs:/app/logs
      - ./backend/vector_db:/app/vector_db
    expose:
      - "${BACKEND_PORT}"  # 不再对外暴露，用于 nginx 内部通信
    # 用 unless-stopped 而非 on-failure:N，避免任何短暂崩溃把容器永久打死后
    # 再也接收不到用户修过的 .env。手动 docker-compose stop 仍可正常停下。
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT}/api/sys_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # WHISPER_MODEL_SIZE 选 medium 及以上请把这里调到 8g+，
    # 否则首次模型加载时容易被 host OOM-killer 干掉。
    mem_limit: 4g

  frontend:
    container_name: opennoter-frontend
    build:
      context: .
      dockerfile: OpenNoter_frontend/Dockerfile
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
    env_file:
      - .env
    expose:
      - "80"  # 不暴露给宿主机，只供 nginx 访问
    restart: unless-stopped
    mem_limit: 512m

  nginx:
    container_name: opennoter-nginx
    image: nginx:1.25-alpine
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    mem_limit: 256m
