
services:
  backend:
    container_name: opennoter-backend
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
      args:
        # 国内拉不到 docker.io 时设置 BASE_REGISTRY；注意所选镜像需要支持 nvidia/cuda 命名空间
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file:
      - .env
    environment:
      - BACKEND_PORT=${BACKEND_PORT}
      - BACKEND_HOST=${BACKEND_HOST}
      # SQLite 落到 data 卷；多副本请改 Postgres，见 README「多副本」
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/open_noter.db}
    volumes:
      # 代码在镜像内（Dockerfile COPY）；这里只挂运行时数据，避免整目录 ./backend:/app
      # 把代码与 DB/密钥/Cookie/笔记混在一起（备份易泄露，升级也难）。
      # 本地改代码热重载可临时加回：- ./backend:/app（会盖住镜像代码）。
      - ./backend/data:/app/data
      - ./backend/config:/app/config
      - ./backend/static:/app/static
      - ./backend/uploads:/app/uploads
      - ./backend/note_results:/app/note_results
      - ./backend/models:/app/models
      - ./backend/logs:/app/logs
      - ./backend/vector_db:/app/vector_db
    expose:
      - "${BACKEND_PORT}"  # 不再对外暴露，用于 nginx 内部通信
    # 用 unless-stopped 避免短暂崩溃把容器永久打死后再也读不到 .env 修改
    restart: unless-stopped
    # 探活打 /api/sys_check（轻量），**不要**打 /api/sys_health。
    #
    # 原因（F54）：`/api/sys_health` 会调 `ensure_ffmpeg_or_raise()`，
    # 而它内部执行 `subprocess.run(["ffmpeg", "-version"])` —— 也就是
    # **每 30 秒 fork 一个 ffmpeg 子进程**。在 `mem_limit: 4g` + Whisper
    # 占满内存时，这个额外进程可能成为 OOM 的最后一击。
    #
    # `/api/sys_check` 只返回 200 + `{code:0}`（不碰 ffmpeg / DB），
    # 它才是「进程还活着吗」该问的问题。要查细项请打开设置页
    # 或直接 `curl /api/sys_health`（此时按需触发，而不是常驻轮询）。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${BACKEND_PORT}/api/sys_check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s   # GPU 镜像首次加载 CUDA 比 CPU 慢，给久一点
    # GPU 部署默认跑较大模型，把内存限制提到 8g 避免 host OOM
    mem_limit: 8g
    # GPU 预留（F55）
    #
    # 这份写法是 **Docker 官方推荐**，`docker compose up`（Compose v2）从
    # 2.0.0 起就支持 `deploy.resources.reservations.devices`，会正确翻译成
    # 容器的 DeviceRequest。
    #
    # ⚠️ 它**在已废弃的 `docker-compose` v1（Python 版 1.29.x）下不生效** ——
    # 那版只读顶层的 `device_requests`。若你用 v1，会看到「GPU 没传进容器」
    # 但没有任何报错。判断版本：`docker compose version`（v2）vs
    # `docker-compose version`（v1）。请优先用 v2。
    #
    # 另外还需要宿主机装好 nvidia-container-toolkit 并配置 runtime，
    # 否则即使声明了也拿不到 GPU。
    deploy:
      resources:
        reservations:
          devices:
            - driver: "nvidia"
              count: "all"
              capabilities: ["gpu"]

  frontend:
    container_name: opennoter-frontend
    build:
      context: .
      dockerfile: OpenNoter_frontend/Dockerfile
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
    env_file:
      - .env
    expose:
      - "80"  # 不暴露给宿主机，只供 nginx 访问
    restart: unless-stopped
    mem_limit: 512m

  nginx:
    container_name: opennoter-nginx
    image: nginx:1.25-alpine
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    mem_limit: 256m
