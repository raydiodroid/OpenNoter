# 单镜像（Dockerfile.complete / 一体化部署）专用 nginx 配置。
#
# 与 nginx/default.conf（docker-compose 多容器版）的关键区别：
#   - 前端不再由独立的 frontend 容器提供，构建产物已直接 COPY 到本镜像的
#     /usr/share/nginx/html，所以 location / 走【静态文件】而非反代 frontend；
#   - backend 与 nginx 同处一个容器，所以 /api、/static、/uploads 代理到 127.0.0.1:8483。
#
# XFF 信任模型（与 backend app.utils.ip_allow.client_ip 对齐）：
#   - 用 $remote_addr **覆盖**客户端可能伪造的 X-Forwarded-For，不追加。
#   - 同时设置 X-Real-IP=$remote_addr。本 nginx 是距 backend 最近的受信跳。
#
# 注意：请勿把本文件的 location / 改成代理 frontend，否则单镜像里没有 frontend
# 服务，会回退到 nginx 默认欢迎页。多容器（compose）请改 nginx/default.conf。
server {
  listen 80;
  client_max_body_size 512m;  # 对齐 UPLOAD_MAX_SIZE_MB=500（+余量）；勿再开到 10G

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # 前端静态文件由本容器直接服务（构建产物已 COPY 到此目录）
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # backend 与 nginx 同容器，代理到本地
  location /api/ {
    proxy_pass http://127.0.0.1:8483;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    # 超时链必须严格递增：后端 90s < 前端 120s < nginx 180s。
    # 详见 nginx/default.conf 同名注释（任何一层 <= 下一层就是"提前断点"）。
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_connect_timeout 15s;
  }

  # API 文档：后端自带且要求鉴权，匿名访问会拿到 401。
  # 必须放在 location / 之前匹配，否则会被 SPA fallback 吞掉。
  location = /openapi.json {
    proxy_pass http://127.0.0.1:8483/openapi.json;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location = /docs {
    proxy_pass http://127.0.0.1:8483/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /static/ {
    proxy_pass http://127.0.0.1:8483/static/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    # 受 ACL 保护 + 带长期令牌的截图资源不能标 public（会经 CDN 扩散凭证）。
    # 统一收敛成一条 Cache-Control，避免与 expires 重复发头。
    # 详见 nginx/default.conf 同名注释。
    add_header Cache-Control "private, max-age=604800";
  }

  # 鉴权下载（backend/main.py serve_upload）；转发 Cookie/Authorization。
  location /uploads/ {
    proxy_pass http://127.0.0.1:8483/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
  }
}
