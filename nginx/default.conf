server {
  listen 80;
  client_max_body_size 512m;  # 对齐 UPLOAD_MAX_SIZE_MB=500（+余量）；勿再开到 10G

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # 多容器(docker-compose)部署：前端在独立的 frontend 容器，代理过去。
  # 单镜像(Dockerfile.complete)部署请勿用本文件，改用 nginx/standalone.conf。
  #
  # XFF 信任模型（与 backend app.utils.ip_allow.client_ip 对齐）：
  #   - 用 $remote_addr **覆盖**客户端可能伪造的 X-Forwarded-For，不追加。
  #   - 同时设置 X-Real-IP=$remote_addr，作为备用可信头。
  #   - 本 nginx 视为「距 backend 最近、且唯一受信」的反代；若前面还有
  #     SafeLine/NPMplus，请让那些组件直连 backend，或自行改写为本跳
  #     只信任已知上游（误用 $proxy_add_x_forwarded_for 会恢复伪造面）。
  location / {
    proxy_pass http://frontend:80;
  }

  location /api/ {
    proxy_pass http://backend:8483;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    # 超时链必须是「后端预算 < 前端超时 < nginx 超时」的严格递增关系：
    #   后端 CHAT_TOTAL_TIMEOUT = 90s
    #   前端 chat 请求超时   = 120s
    #   nginx（本处）        = 180s
    # 任何一层 <= 下一层就会变成"提前断点"：nginx 默认 60s 会先把后端 90s 的
    # 预算掐断，前端只能看到 504，而不是后端给出的明确超时/错误信息。
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_connect_timeout 15s;
  }

  # API 文档：后端自带且要求鉴权，匿名访问会拿到 401。
  # 必须放在 location / 之前匹配，否则会被 SPA fallback 吞掉。
  location = /openapi.json {
    proxy_pass http://backend:8483/openapi.json;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location = /docs {
    proxy_pass http://backend:8483/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /static/ {
    proxy_pass http://backend:8483/static/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;

    # 这里不能标 public。
    #
    # /static/screenshots/<task_id>/... 是受 ACL 保护的资源，且后端会签发
    # 长期令牌（?t=<HMAC(secret, task_id)>，见 backend/app/utils/static_signing.py）。
    # 令牌是"能力凭证"—— 拿到 URL 的人就能读，不需要登录。
    #
    # 若标成 public, immutable，前置 CDN / 共享缓存会把这份响应代持并回给
    # 其他请求方，等于把凭证扩散出去（报告 F9 / F33 指出的部署相关风险）。
    #
    # private 只禁止「共享缓存」存储，浏览器自身仍可缓存 7 天 —— 单用户的
    # 首屏/翻页体验不受影响，只是不再适合挂公共 CDN。
    #
    # 另外：原来同时用了 `expires 7d` 与 `add_header Cache-Control`，会发出
    # 两条 Cache-Control 响应头（max-age=604800 + public, immutable）。
    # 这里统一收敛为一条，避免歧义。
    add_header Cache-Control "private, max-age=604800";
  }

  # 鉴权下载（backend/main.py serve_upload）；勿用匿名静态，需转发 Cookie/Authorization。
  location /uploads/ {
    proxy_pass http://backend:8483/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
  }
}
