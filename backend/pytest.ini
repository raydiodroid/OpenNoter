[pytest]
# 测试从 backend/ 目录跑：python -m pytest
#
# 历史上 backend/__init__.py（空文件）让 pytest 的 prepend 导入模式把 basedir
# 算到 backend/ 的父目录，于是 `import app` 命中的是 backend 根目录而不是
# backend/app/ —— 容器里 backend/* 被平铺到 /app，问题更明显，表现为
# ModuleNotFoundError: No module named 'app.utils'。
# 该文件已删除（没有任何代码 import backend 包），此处固定测试的导入方式。
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
